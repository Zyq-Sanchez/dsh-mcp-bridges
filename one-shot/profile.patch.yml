# Re-enable the managed credential store for the headless profile.
#
# The shipped `headless` profile deliberately disables the GUI credential store and
# only reads DEEPSEEK_API_KEY from the launch environment or .env. This overlay puts
# the saved sign-in back so `dsh --profile headless` behaves like the desktop app.
# Pass it with: dsh headless --patch <this file>
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
